name: TAS Sync Check

on:
  pull_request:
    branches: [ dev ]

jobs:
  build:
    strategy:
      matrix:
        tas:
          - name: Celeste
          - name: StrawberryJam2021

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Retrieve and decrypt Celeste
      run: |
        curl --fail -o Celeste.tar.gz.gpg https://github.com/maddie480/EverestInDocker/raw/refs/heads/main/Celeste.tar.gz.gpg
        gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.CELESTE_GPG_PASSPHRASE }}" --output Celeste.tar.gz Celeste.tar.gz.gpg
        rm Celeste.tar.gz.gpg

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Run $ {{ matrix.tas.name }} TAS
      run: cd .github && ./everest-pr-headless-test.sh ${{ matrix.tas.name }}
